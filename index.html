<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>GeneaViz — M4 : arbre combiné avec conjoints</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 1.5rem; }
  #status { margin: 1rem 0; padding: .75rem 1rem; background: #f4f6f8; border-radius: 6px; }
  #status.error { background: #fde8e8; }
  .search-fields { display: flex; gap: .5rem; flex-wrap: wrap; }
  .search-fields input { padding: .5rem; border: 1px solid #ccc; border-radius: 6px; min-width: 12rem; }
  .search-fields button { padding: .5rem 1rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  .search-status { color: #555; margin: .5rem 0; }
  .search-results { list-style: none; padding: 0; margin: 0; }
  .search-result { display: flex; justify-content: space-between; gap: 1rem;
    padding: .5rem .75rem; border: 1px solid #e5e7eb; border-radius: 6px;
    margin-bottom: .35rem; cursor: pointer; }
  .search-result:hover { background: #f0f7ff; }
  .search-result.selected { background: #dbeafe; border-color: #2563eb; }
  .result-dates { color: #555; white-space: nowrap; }
  #details { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; margin-top: .5rem; }
  #details table { border-collapse: collapse; }
  #details td { padding: .25rem .75rem .25rem 0; vertical-align: top; }
  #details td:first-child { color: #666; }
  .est { color: #b45309; font-style: italic; }
  pre { background: #f8f8f8; padding: 1rem; overflow: auto; }
  #tree-controls { display: flex; gap: 1.25rem; align-items: center; margin: .5rem 0; color: #555; flex-wrap: wrap; }
  #tree-controls label { display: flex; gap: .35rem; align-items: center; }
  #tree-controls select { padding: .3rem; border: 1px solid #ccc; border-radius: 6px; }
  #tree-container { overflow: hidden; border: 1px solid #e5e7eb; border-radius: 8px; height: 32rem; background: #fff; }
  .tree-link { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
  .spouse-link { stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 2 3; }
  .tree-node { cursor: pointer; }
  .tree-node rect { fill: #fff; stroke: #cbd5e1; stroke-width: 1; }
  .tree-node rect.m { fill: #dbeafe; }
  .tree-node rect.f { fill: #fce7f3; }
  .tree-node rect.root { stroke: #2563eb; stroke-width: 2; }
  .tree-node rect.est { stroke: #b45309; stroke-dasharray: 4 3; }
  .tree-node text { font-size: 12px; }
  .tree-node .node-name { font-weight: 600; }
  .tree-node .node-dates { fill: #555; }
  .tree-node .node-dates.est { fill: #b45309; font-style: italic; }
</style>
<script type="importmap">
{
  "imports": {
    "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/+esm",
    "@treeviz/gedcom-parser": "https://cdn.jsdelivr.net/npm/@treeviz/gedcom-parser@2.0.3/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
    "read-gedcom": "https://cdn.jsdelivr.net/npm/read-gedcom@0.3.2/+esm"
  }
}
</script>
</head>
<body>
<h1>GeneaViz — M4 : arbre combiné avec conjoints</h1>

<p>
  <label for="file">Fichier GEDCOM :</label>
  <input type="file" id="file" accept=".ged,.gedcom,text/plain">
</p>

<div id="status">En attente d'un fichier…</div>

<section id="search-section" hidden>
  <h2>Rechercher un individu</h2>
  <div id="search-container"></div>
</section>

<section id="detail-section" hidden>
  <h2>Individu sélectionné</h2>
  <div id="details">Aucun individu sélectionné.</div>
</section>

<section id="tree-section" hidden>
  <h2>Arbre combiné ascendants / descendants</h2>
  <div id="tree-controls"></div>
  <div id="tree-container"></div>
</section>

<pre id="output"></pre>

<script type="module" src="./js/app.js"></script>
</body>
</html>

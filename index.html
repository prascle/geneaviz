<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>GeneaViz — M8a : lecture GEDCOM via read-gedcom (arbre, chronologique, 3D)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 1.5rem; }
  #status { margin: 1rem 0; padding: .75rem 1rem; background: #f4f6f8; border-radius: 6px; }
  #status.error { background: #fde8e8; }
  .search-fields { display: flex; gap: .5rem; flex-wrap: wrap; }
  .search-fields input { padding: .5rem; border: 1px solid #ccc; border-radius: 6px; min-width: 12rem; }
  .search-fields button { padding: .5rem 1rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  .search-status { color: #555; margin: .5rem 0; }
  .search-results { list-style: none; padding: 0; margin: 0; }
  .search-result { display: flex; justify-content: space-between; gap: 1rem;
    padding: .5rem .75rem; border: 1px solid #e5e7eb; border-radius: 6px;
    margin-bottom: .35rem; cursor: pointer; }
  .search-result:hover { background: #f0f7ff; }
  .search-result.selected { background: #dbeafe; border-color: #2563eb; }
  .result-dates { color: #555; white-space: nowrap; }
  #details { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; margin-top: .5rem; }
  #details table { border-collapse: collapse; }
  #details td { padding: .25rem .75rem .25rem 0; vertical-align: top; }
  #details td:first-child { color: #666; }
  .est { color: #b45309; font-style: italic; }
  pre { background: #f8f8f8; padding: 1rem; overflow: auto; }
  #view-bar { display: flex; gap: .5rem; align-items: center; margin: 1rem 0; flex-wrap: wrap; }
  .view-btn { padding: .45rem 1rem; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
  .view-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  #view-bar select { padding: .3rem; border: 1px solid #ccc; border-radius: 6px; }
  #view-bar label { display: flex; gap: .3rem; align-items: center; color: #555; }
  .vsep { width: 1px; height: 1.6rem; background: #e5e7eb; margin: 0 .4rem; }
  #btn-reset { padding: .45rem .9rem; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
  #btn-fullscreen { padding: .45rem .9rem; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
  #workspace:fullscreen { background: #fff; padding: 1rem 1.5rem; }
  .ctx-menu { position: fixed; z-index: 1100; display: none; min-width: 15rem;
    background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.15); padding: .3rem 0; font-size: 13px; }
  .ctx-item { padding: .45rem .9rem; cursor: pointer; }
  .ctx-item:hover { background: #eff6ff; }
  .ctx-item.disabled { color: #9ca3af; cursor: default; }
  .ctx-item.disabled:hover { background: none; }
  .ctx-separator { height: 1px; background: #e5e7eb; margin: .3rem 0; }
  #tree-controls { display: flex; gap: 1.25rem; align-items: center; margin: .5rem 0; color: #555; flex-wrap: wrap; }
  #tree-controls label { display: flex; gap: .35rem; align-items: center; }
  #tree-controls select { padding: .3rem; border: 1px solid #ccc; border-radius: 6px; }
  #tree-controls button { padding: .3rem .8rem; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
  #tree-container { overflow: hidden; border: 1px solid #e5e7eb; border-radius: 8px; height: 32rem; background: #fff; }
  .tree-link { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
  .spouse-link { stroke: #b45309; stroke-width: 1.5; }
  .tree-node { cursor: pointer; }
  .tree-node rect { fill: #fff; stroke: #cbd5e1; stroke-width: 1; }
  .tree-node rect.m { fill: #dbeafe; }
  .tree-node rect.f { fill: #fce7f3; }
  .tree-node rect.root { stroke: #2563eb; stroke-width: 2; }
  .tree-node rect.est { stroke: #b45309; stroke-dasharray: 4 3; }
  .tree-node rect.ghost { fill: #fafafa; stroke: #cbd5e1; stroke-dasharray: 3 3; }
  /* individus issus d'une édition M6 : fond hachuré (arbre) / contour (chrono) */
  .tree-node rect.hatch { fill: url(#hatchEdit); }
  .tl-box rect.edit { stroke: #64748b; stroke-width: 1.4; }
  .tree-node text { font-size: 12px; }
  .tree-node .node-name { font-weight: 600; }
  .tree-node .node-dates { fill: #555; }
  .tree-node .node-dates.est { fill: #b45309; font-style: italic; }
  .tree-node .node-dates.ghost-label { fill: #999; font-style: italic; }
  .tree-node, .tl-box, .tree-link, .spouse-link, .tl-link { transition: opacity .18s; }
  .tree-node.dim, .tl-box.dim { opacity: .22; }
  .tree-node.hl rect, .tl-box.hl rect { stroke: #2563eb; stroke-width: 2; }
  .tree-link.dim, .spouse-link.dim, .tl-link.dim { opacity: .1; }  
  .tree-tip { position: fixed; z-index: 1000; display: none; max-width: 22rem;
    background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
    padding: .6rem .8rem; box-shadow: 0 4px 14px rgba(0,0,0,.12);
    pointer-events: none; font-size: 13px; line-height: 1.45; }
  .tree-tip .tip-name { font-weight: 600; }
  .tree-tip .tip-dates { color: #555; }
  .tree-tip .tip-fam { color: #555; }
  .tree-tip .tip-id { color: #999; font-size: 11px; }
  #timeline-controls { display: flex; gap: .5rem; align-items: center; margin: .5rem 0; color: #555; font-size: .85rem; }
  #timeline-container { overflow: auto; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
  .tl-grid { stroke: #eef1f4; stroke-width: 1; }
  .tl-tick { font-size: 10px; fill: #666; }
  .tl-box { cursor: pointer; }
  .tl-box rect { fill: #fff; stroke: #cbd5e1; stroke-width: 1; }
  .tl-box rect.m { fill: #dbeafe; }
  .tl-box rect.f { fill: #fce7f3; }
  /* générations relatives à l'individu survolé (vue chrono) */
  .tl-box rect.g0  { stroke: #475569; stroke-width: 1.6; }   /* sa génération */
  .tl-box rect.g-1 { stroke: #7c3aed; stroke-width: 1.6; }   /* parents */
  .tl-box rect.g1  { stroke: #0e7490; stroke-width: 1.6; }   /* enfants */
  .tl-box rect.root { stroke: #2563eb; stroke-width: 2; }
  .tl-box rect.est { stroke: #b45309; stroke-dasharray: 4 3; }
  .tl-box rect.alive { stroke-dasharray: 2 2; }
  .tl-box text { font-size: 10px; fill: #1f2937; pointer-events: none; }
  .tl-box:hover rect { stroke: #2563eb; }
  .tl-link { fill: none; stroke: #94a3b8; stroke-width: 1.2; }
  .tl-marry { stroke: #b45309; stroke-width: 2; }
  .tl-marry.dim { opacity: .1; }
  /* mini-éditeur de générations dans le menu contextuel (M6b) */
  .ctx-editor { display: flex; gap: .45rem; align-items: center;
    padding: .45rem .9rem; font-size: 13px; }
  .ctx-editor input { width: 3.4rem; padding: .15rem .3rem;
    border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }
  .ctx-editor button { padding: .15rem .5rem; border: 1px solid #cbd5e1;
    border-radius: 4px; background: #eff6ff; cursor: pointer; font-size: 13px; }

  /* vue 3D (M7a) : le canvas Three.js remplit le cadre */
  #view3d-container { overflow: hidden; border: 1px solid #e5e7eb;
    border-radius: 8px; height: 32rem; background: #fff; position: relative; }
  #view3d-presets { position: absolute; top: 8px; right: 8px;
    display: flex; gap: .35rem; z-index: 5; }
  #view3d-presets button { padding: .15rem .5rem; font-size: 12px;
    border: 1px solid #cbd5e1; border-radius: 4px; background: #fff;
    cursor: pointer; }
  #view3d-presets button:hover { background: #eff6ff; }

  /* panneau de réglages de la vue 3D (M7b) */
  #view3d-settings { position: absolute; top: 44px; right: 8px; z-index: 5;
    background: #fff; border: 1px solid #cbd5e1; border-radius: 6px;
    font-size: 12px; padding: .35rem .55rem; min-width: 11rem; }
  #view3d-settings summary { cursor: pointer; color: #555; padding: .1rem .15rem; }
  #view3d-settings .v3d-set-row { display: grid;
    grid-template-columns: auto 1.6rem 1fr; gap: .35rem;
    align-items: center; padding: .18rem .15rem; }
  #view3d-settings .v3d-set-row label { color: #333; white-space: nowrap; }
  #view3d-settings .v3d-set-row span { text-align: right; color: #555; }
  #view3d-settings .v3d-set-row input[type="range"] { width: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/+esm",
    "@treeviz/gedcom-parser": "https://cdn.jsdelivr.net/npm/@treeviz/gedcom-parser@2.0.3/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
    "read-gedcom": "https://cdn.jsdelivr.net/npm/read-gedcom@0.3.2/+esm"
  }
}
</script>
</head>
<body>
<h1>GeneaViz — M8a : lecture GEDCOM via read-gedcom (arbre, chronologique, 3D)</h1>

<p>
  <label for="file">Fichier GEDCOM :</label>
  <input type="file" id="file" accept=".ged,.gedcom,text/plain">
</p>

<div id="status">En attente d'un fichier…</div>

<section id="search-section" hidden>
  <h2>Rechercher un individu</h2>
  <div id="search-container"></div>
</section>

<section id="detail-section" hidden>
  <h2>Individu sélectionné</h2>
  <div id="details">Aucun individu sélectionné.</div>
</section>

<div id="workspace">
  <div id="view-bar" hidden>
    <button type="button" class="view-btn active" data-view="tree">Arbre</button>
    <button type="button" class="view-btn" data-view="chrono">Chronologique</button>
    <button type="button" class="view-btn" data-view="view3d">3D</button>
    <span class="vsep"></span>
    <label>↑ Ascendants <select id="gen-up"></select></label>
    <label>↓ Descendants <select id="gen-down"></select></label>
    <button type="button" id="btn-reset">⟲ Recentrer</button>
    <button type="button" id="btn-fullscreen">⛶ Plein écran</button>
  </div>

  <section id="tree-section" hidden>
    <h2>Arbre combiné ascendants / descendants</h2>
    <div id="tree-container"></div>
  </section>

  <section id="timeline-section" hidden>
    <h2>Vue chronologique</h2>
    <div id="timeline-container"></div>
  </section>

  <section id="view3d-section" hidden>
    <h2>Vue 3D</h2>
    <div id="view3d-container"></div>
  </section>
</div>

<pre id="output"></pre>

<script type="module" src="./js/app.js"></script>
</body>
</html>
